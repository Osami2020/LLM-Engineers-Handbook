services:
  mongo:
    # Pinned on purpose: 8.2.12 runs on both Windows (Docker Desktop) and Linux kernel 7.0.x.
    # 7.0 can't open data written by 8.x, and 8.3+/latest exit on Linux kernels 6.19-7.0.13
    # (https://jira.mongodb.org/browse/SERVER-125742).
    image: mongo:8.2.12
    container_name: "llm_engineering_mongo"
    logging:
      options:
        max-size: 1g
    environment:
      MONGO_INITDB_ROOT_USERNAME: "llm_engineering"
      MONGO_INITDB_ROOT_PASSWORD: "llm_engineering"
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
    networks:
      - local
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: "llm_engineering_qdrant"
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - local
    restart: always

volumes:
  mongo_data:
  qdrant_data:

networks:
  local:
    driver: bridge